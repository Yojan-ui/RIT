# fly launch --no-deploy   (then: fly secrets set ALLOWED_ORIGINS=https://<your-app>.vercel.app)
app = "pqc-scanner-api"
primary_region = "bom"

[build]

[env]
  PORT = "8000"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
