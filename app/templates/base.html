<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
  {# Tailwind's in-browser build: fine for development; swap for a CLI-built stylesheet in production. #}
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --font-sans: "Archivo", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --color-paper: var(--paper);
      --color-surface: var(--surface);
      --color-ink: var(--ink);
      --color-muted: var(--muted);
      --color-line: var(--line);
      --color-exposed: var(--exposed);
      --color-partial: var(--partial);
      --color-mitigated: var(--mitigated);
      --color-unknown: var(--unknown);
      --color-focus: var(--focus);
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased">
  <header class="border-b border-line">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
        <svg viewBox="0 0 24 24" class="size-6 text-exposed" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M9 12h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        {{ app_name }}
      </a>
      <nav class="text-sm"><a class="text-muted hover:text-ink" href="/docs">API docs</a></nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
    {% block content %}{% endblock %}
  </main>
  <footer class="pb-8 text-center text-xs text-muted">{{ app_name }} v{{ version }}</footer>
</body>
</html>
