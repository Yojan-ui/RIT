<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">◉</span> {{ app_name }}</div>
    <nav><a href="/docs">API docs</a></nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">v{{ version }}</footer>
</body>
</html>
