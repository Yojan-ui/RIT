{% if items %}
<span class="text-muted">Recent:</span>
{% for item in items %}
<button type="button"
        class="rounded-full border border-line bg-surface px-3 py-1 hover:border-ink"
        hx-post="/api/v1/ui/scan"
        hx-vals='{"domain": {{ item.domain | tojson }}}'
        hx-target="#result"
        hx-indicator="#scan-status, #result">{{ item.domain }}</button>
{% endfor %}
{% endif %}
