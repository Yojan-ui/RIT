# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: securemailscope
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Many hosts block outbound port 25. The probe then reports STARTTLS as
      # unmeasured (excluded from the score); short budgets keep scans quick.
      - key: SMTP_TIMEOUT
        value: "5"
      - key: PROBE_BUDGET
        value: "12"
      - key: SCAN_TIMEOUT
        value: "25"
